<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>Fortune Merlion: Blooming Hearts</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{
      width:100%;height:100%;
      background:#1a1a2e;
      overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      touch-action:none;
    }
    #game-wrap{
      position:relative;
      width:480px;height:845px;
      overflow:hidden;
    }

    /* ── Overlays ─────────────────────────────────────────────────── */
    .ov{
      position:absolute;inset:0;
      display:none;
      flex-direction:column;align-items:center;justify-content:center;
      z-index:100;
    }
    .ov.on{display:flex;}

    #ov-title{
      background:url('assets/bg/Home.PNG') center/cover no-repeat;
    }

    /* ── HUD ─────────────────────────────────────────────────────── */
    #hud{
      position:absolute;top:0;left:0;right:0;
      padding:10px 14px;
      display:none;
      justify-content:space-between;align-items:center;
      z-index:50;
      pointer-events:none;
    }
    #hud.on{display:flex;}
    #hud-lives{display:flex;gap:4px;align-items:center;}
    #hud-lives img{width:32px;height:32px;object-fit:contain;}
    .hud-num{
      font-size:23px;font-weight:900;color:#fff;
      text-shadow:2px 2px 0 #000,-1px -1px 0 #000;
      font-family:'Arial Rounded MT Bold',Arial,sans-serif;min-width:44px;text-align:center;
    }

    /* ── Wooden panel ────────────────────────────────────────────── */
    .panel{
      background:#fdf3dc;
      border:6px solid #8b5e1a;
      border-radius:18px;
      box-shadow:0 6px 28px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35);
      padding:24px 28px;
      text-align:center;
      width:420px;
    }
    .panel-head{
      font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-size:24px;font-weight:bold;
      color:#6b3c10;margin-bottom:10px;
      text-shadow:0 1px 0 rgba(255,255,255,.5);
    }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn{
      display:inline-block;padding:12px 28px;
      border-radius:22px;border:none;cursor:pointer;
      font-size:17px;font-weight:bold;font-family:'Arial Rounded MT Bold',Arial,sans-serif;
      letter-spacing:.5px;transition:transform .08s;
    }
    .btn:active{transform:scale(.95);}
    .btn-green{
      background:linear-gradient(180deg,#74cc52,#3e8f22);
      color:#fff;border:3px solid #2d6a14;
      text-shadow:0 1px 2px rgba(0,0,0,.4);
      box-shadow:0 3px 0 #1d4a0d;
    }
    .btn-red{
      background:linear-gradient(180deg,#e06060,#c0392b);
      color:#fff;border:3px solid #922b21;
      box-shadow:0 3px 0 #6e1e14;
    }
    .btn-row{display:flex;gap:14px;justify-content:center;margin-top:16px;}

    /* ── Entry form ──────────────────────────────────────────────── */
    .form-g{margin-bottom:14px;text-align:left;}
    .form-g label{display:block;font-size:13px;color:#5a3210;margin-bottom:4px;font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-weight:bold;}
    .form-g input{
      width:100%;padding:10px 12px;
      border:2px solid #b8832a;border-radius:8px;
      font-size:16px;background:#fffbf0;color:#333;outline:none;
    }
    .form-g input:focus{border-color:#e8a030;}
    .err{color:#c0392b;font-size:13px;min-height:18px;margin-bottom:8px;font-family:'Arial Rounded MT Bold',Arial,sans-serif;}
    .pdpa{font-size:11px;color:#7b5020;line-height:1.55;margin:8px 0 12px;text-align:left;}

    /* ── Score display ───────────────────────────────────────────── */
    #final-score{
      font-size:68px;font-weight:900;color:#d4007a;
      font-family:'Arial Rounded MT Bold',Arial,sans-serif;line-height:1;margin:6px 0 16px;
      text-shadow:2px 2px 0 rgba(0,0,0,.2);
    }
    .htp-img{width:100%;border-radius:8px;margin-bottom:14px;}
    @keyframes pop-in{
      0%  { transform:scale(0.4); opacity:0; }
      70% { transform:scale(1.12); opacity:1; }
      100%{ transform:scale(1);   opacity:1; }
    }
    .pop-in{ animation:pop-in 0.45s cubic-bezier(.22,.68,0,1.4) forwards; }
  </style>
</head>
<body>
<div id="game-wrap">

  <!-- ── HUD: lives | timer | score ─────────────────────────────── -->
  <div id="hud">
    <div id="hud-lives"></div>
    <div id="hud-timer" class="hud-num" style="position:absolute;left:50%;transform:translateX(-50%);">1:30</div>
    <div id="hud-score" class="hud-num" style="color:#e91e8c;">0</div>
  </div>

  <!-- ── TITLE ──────────────────────────────────────────────────── -->
  <div class="ov on" id="ov-title">
    <!-- Logo + button grouped and centred together at screen middle -->
    <div id="title-content" style="display:flex;flex-direction:column;align-items:center;gap:0;margin-top:70px;">
      <img src="assets/ui/GAME LOGO.png" style="width:320px;margin-bottom:-100px;" alt="Fortune Merlion: Blooming Hearts">
      <!-- wrapper so we can overlay a precise hit zone over the button visual -->
      <div id="play-btn-wrap" style="position:relative;width:300px;visibility:hidden;">
        <img src="assets/ui/PLAY.png" style="width:100%;display:block;pointer-events:none;" alt="Play">
        <div id="btn-play" style="position:absolute;top:33%;left:10%;right:10%;height:27%;cursor:pointer;border-radius:30px;"></div>
      </div>
    </div>
  </div>

  <!-- ── HOW TO PLAY ─────────────────────────────────────────────── -->
  <div class="ov" id="ov-tutorial" style="background:rgba(0,0,0,.55);">
    <div id="tutorial-card" style="position:relative;width:460px;max-width:97vw;">
      <img src="assets/ui/HOW TO PLAY.png" style="width:100%;display:block;" alt="How to Play">
      <!-- invisible hit zone over the X button drawn in the image (top-right) -->
      <div id="btn-close-tutorial"
        style="position:absolute;top:7%;right:12%;width:13%;padding-bottom:12%;cursor:pointer;border-radius:50%;"></div>
      <!-- invisible hit zone over the START GAME button drawn in the image (bottom centre) -->
      <div id="btn-start-game"
        style="position:absolute;bottom:11%;left:25%;right:25%;height:10%;cursor:pointer;border-radius:25px;"></div>
    </div>
  </div>

  <!-- ── SCOREBOARD ─────────────────────────────────────────────── -->
  <div class="ov" id="ov-scoreboard" style="background:rgba(0,0,0,.6);">
    <div style="position:relative;width:460px;max-width:97vw;">
      <img src="assets/ui/SCORE BOARD.png" style="width:100%;display:block;" alt="Scoreboard">
      <!-- score overlaid in the blank parchment area — centred vertically between header and buttons -->
      <div style="position:absolute;top:25%;bottom:16%;left:12%;right:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;">
        <div style="font-size:42px;color:#1a0a00;font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-weight:900;line-height:1;margin-bottom:10px;text-shadow:1px 1px 0 rgba(255,255,255,.4);">GAME OVER</div>
        <div style="font-size:18px;color:#5a3210;font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-weight:bold;letter-spacing:1px;margin-bottom:2px;">YOUR SCORE:</div>
        <div id="final-score" style="font-size:90px;font-weight:900;color:#e91e8c;line-height:1;font-family:'Arial Rounded MT Bold',Arial,sans-serif;text-shadow:2px 2px 0 rgba(0,0,0,.1);">0</div>
      </div>
      <!-- invisible PLAY AGAIN hit zone -->
      <div id="btn-play-again" style="position:absolute;bottom:12%;left:15%;width:29%;height:9%;cursor:pointer;border-radius:30px;"></div>
      <!-- invisible EXIT GAME hit zone -->
      <div id="btn-exit"       style="position:absolute;bottom:12%;left:55%;width:29%;height:9%;cursor:pointer;border-radius:30px;"></div>
    </div>
  </div>

  <!-- ── ENTRY FORM ──────────────────────────────────────────────── -->
  <div class="ov" id="ov-entry" style="background:rgba(0,0,0,.6);">
    <div style="width:400px;max-width:94vw;">
      <!-- Green banner header matching the SCOREBOARD style -->
      <div style="background:linear-gradient(180deg,#3d9e28,#1e6010);border:4px solid #c8960a;border-radius:18px 18px 0 0;padding:13px 20px;text-align:center;margin-bottom:-4px;position:relative;z-index:1;box-shadow:0 -2px 0 #ffe234 inset;">
        <div style="font-size:22px;font-weight:900;color:#ffe234;font-family:'Arial Rounded MT Bold',Arial,sans-serif;text-shadow:1px 2px 3px rgba(0,0,0,.5);">SUBMIT YOUR SCORE</div>
      </div>
      <!-- Parchment body -->
      <div style="background:linear-gradient(180deg,#fdf3dc,#f5e4b8);border:4px solid #c8960a;border-top:none;border-radius:0 0 20px 20px;padding:20px 24px 24px;box-shadow:0 8px 32px rgba(0,0,0,.55);">
        <div class="form-g">
          <label>Name (max 20 characters)</label>
          <input type="text" id="inp-name" maxlength="20" placeholder="Your name" autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="form-g">
          <label>Singapore Mobile Number</label>
          <input type="tel" id="inp-phone" maxlength="8" placeholder="8 digits, starting with 8 or 9" inputmode="numeric">
        </div>
        <p class="pdpa">Your mobile number is collected solely to contact the winner. It will never be displayed publicly and will be deleted within 30 days after the event.</p>
        <div class="err" id="entry-err"></div>
        <button class="btn btn-green" id="btn-submit" style="width:100%;margin-bottom:10px;font-size:18px;padding:14px 0;">SUBMIT SCORE</button>
        <button class="btn" id="btn-skip" style="background:linear-gradient(180deg,#d5c0a0,#b89a60);color:#3a1500;width:100%;padding:12px 0;border:3px solid #8b5e1a;box-shadow:0 3px 0 #5a3a10;font-size:15px;">Skip — go back to home</button>
      </div>
    </div>
  </div>

</div><!-- #game-wrap -->

<script>
'use strict';

// ── Config ────────────────────────────────────────────────────────────────────
const MOCK          = true;   // set false once server is running
const SERVER_URL    = '';     // e.g. 'https://yourapp.up.railway.app' — leave '' for same-origin
const GAME_DURATION = 60;     // seconds
const MAX_LIVES     = 3;
const FIRE_RATE_MS  = 220;    // minimum ms between shots

// ── Zone Y-positions (adjust to match where things sit in GAME.jpg) ───────────
// Tip: set  debug:true  in Phaser arcade config below, then fine-tune these
const ZONE_Y = {
  water: [320, 332,343],       // river / waterway band
  road:  [400, 405, 408],       // red running + cycling track
  air:   [245, 285, 313, 340, 367],  // just above waterway — birds visible here, not hidden in sky
};

// ── Spritesheet frame sizes ───────────────────────────────────────────────────
// If an animation looks wrong: frameW = image_total_width / num_frames
// Crow (2064×258, 8 frames), Man (2072×296, 7 frames), Woman (2016×288, 7 frames) confirmed.
// Myna, Pigeon — estimate 256×256. Otter — 2-row sheet, estimate 200×200.
const SHEETS = {
  crow:   { frameW: 258, frameH: 258, frames: 8 },
  man:    { frameW: 296, frameH: 296, frames: 7 },
  woman:  { frameW: 288, frameH: 288, frames: 7 },
  myna:   { frameW: 292, frameH: 292, frames: 6 },  // confirmed 1752×292
  otter:  { frameW: 250, frameH: 250, frames: 9 },  // confirmed 2000×500, 2-row (8+1)
  pigeon: { frameW: 254, frameH: 254, frames: 6 },  // confirmed 1524×254
};

// ── Entity definitions ────────────────────────────────────────────────────────
// isHazard false → SHOOT for points
// isHazard true  → DON'T SHOOT (lose a life)
// flipX true     → sprite naturally faces right; flip so it faces left when moving left
// Scale guide for 3200×3200 static sprites (content fills ~50% = ~1600px):
//   60px target  → scale 0.037   |   80px → 0.050   |   100px → 0.062
// Animated sprites have tight frames (no padding) so scale is straightforward.
const ENTITY_DEFS = [
  // ── TRASH — shoot these ──
  { key:'bottle',     file:'Bottle.PNG',           zone:'road', isHazard:false, pts:10, scale:0.032, hbScale:0.32, rolling:true },
  { key:'bottles',    file:'Bottles.PNG',           zone:'water', isHazard:false, pts:20, scale:0.037, hbScale:0.32 },
  { key:'bottle_sub', file:'Bottle Submerged.PNG',  zone:'water', isHazard:false, pts:10, scale:0.037, hbScale:0.32 },
  { key:'blind_box',  file:'Blind Box.PNG',          zone:'water', isHazard:false, pts:30, scale:0.040, hbScale:0.32 },
  { key:'pellet',     file:'Pellet.PNG',             zone:'water', isHazard:false, pts:10, scale:0.025 },
  { key:'lunch',      file:'Lunch.PNG',              zone:'road',  isHazard:false, pts:15, scale:0.037, hbScale:0.32, rolling:true },
  { key:'soda_can',   file:'Soda Can.PNG',           zone:'road',  isHazard:false, pts:10, scale:0.028, rolling:true },
  { key:'plastic_bag',file:'Plastic Bag.PNG',        zone:'any',   isHazard:false, pts:10, scale:0.040, hbScale:0.32 },
  // ── HAZARDS — do NOT shoot ──
  { key:'elderly01',  file:'Elderly 01.PNG',         zone:'road', isHazard:true, scale:0.052, hbScale:0.32 },
  { key:'elderly02',  file:'Elderly 02.PNG',         zone:'road', isHazard:true, scale:0.052, hbScale:0.32 },
  { key:'man',        file:'Man sprite.png',         zone:'road', isHazard:true, scale:0.36, animated:true, hbScale:0.48 },
  { key:'woman',      file:'Woman sprite.png',       zone:'road', isHazard:true, scale:0.35, animated:true, hbScale:0.48 },
  { key:'otter',      file:'Otter sprite.png',       zone:'road', isHazard:true, scale:0.30, animated:true },
  { key:'pigeon',     file:'Pigeon sprite.png',      zone:'road', isHazard:true, scale:0.28, animated:true },
  { key:'crow',       file:'Crow spritesheet.png',   zone:'air',  isHazard:true, scale:0.30, animated:true },
  { key:'myna',       file:'Myna sprite.png',        zone:'air',  isHazard:true, scale:0.30, animated:true },
];

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[c]));
}

let _activeOv = null;
function showOv(id){
  if(_activeOv) _activeOv.classList.remove('on');
  _activeOv = id ? document.getElementById(id) : null;
  if(_activeOv) _activeOv.classList.add('on');
}

// ── Network (MOCK-able) ───────────────────────────────────────────────────────
function apiPost(path, body){
  if(MOCK) return new Promise(r =>
    setTimeout(()=> r({ ok:true, rank: Math.ceil(Math.random()*30)+1 }), 500));
  return fetch(SERVER_URL + path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  }).then(r => r.json());
}

// ── Shared game state ─────────────────────────────────────────────────────────
let score = 0, lives = MAX_LIVES, timer = GAME_DURATION;
let gameSceneRef = null;

function updateHUD(){
  const el = document.getElementById('hud-lives');
  el.innerHTML = '';
  for(let i = 0; i < MAX_LIVES; i++){
    const img = document.createElement('img');
    img.src = i < lives ? 'assets/sprites/LIFE.png' : 'assets/sprites/LOSE.png';
    img.alt = i < lives ? 'life' : 'lost';
    el.appendChild(img);
  }
  document.getElementById('hud-score').textContent = score;
  const m = Math.floor(timer / 60), s = String(timer % 60).padStart(2,'0');
  document.getElementById('hud-timer').textContent = `${m}:${s}`;
}

// ══════════════════════════════════════════════════════════════════════════════
// PRELOAD SCENE
// ══════════════════════════════════════════════════════════════════════════════
class PreloadScene extends Phaser.Scene {
  constructor(){ super('Preload'); }

  preload(){
    const W = this.scale.width, H = this.scale.height;

    // Canvas is transparent during preload — title screen CSS background shows through
    this.load.on('loaderror', e => console.error('[Asset load failed]', e.key, '→', e.src));

    // Backgrounds
    this.load.image('bg_game', 'assets/bg/GAME.jpg');

    // UI panels/images
    this.load.image('ui_logo',   'assets/ui/GAME LOGO.png');
    this.load.image('ui_finish', 'assets/ui/FINISH.png');
    this.load.image('ui_leader', 'assets/ui/LEADERBOARD.png');

    // HUD icons
    this.load.image('life',      'assets/sprites/LIFE.png');
    this.load.image('lose_icon', 'assets/sprites/LOSE.png');
    this.load.image('fire_shot', 'assets/sprites/FIRE SHOT.png');

    // Static entity images
    ENTITY_DEFS.filter(e => !e.animated).forEach(e =>
      this.load.image(e.key, `assets/sprites/${e.file}`)
    );

    // Animated spritesheets
    ENTITY_DEFS.filter(e => e.animated).forEach(e => {
      const sh = SHEETS[e.key];
      this.load.spritesheet(e.key, `assets/sprites/${e.file}`, {
        frameWidth:  sh.frameW,
        frameHeight: sh.frameH,
      });
    });

    // Charm / fortune cards
    const charmNames = ['EMPATHY','NOBILITY','LONGEVITY','VITALITY','STABILITY','SERENITY'];
    charmNames.forEach((name, i) =>
      this.load.image(`charm_${i}`, `assets/sprites/0${i+1}. ${name}.jpg`)
    );
  }

  create(){
    // Register walk/fly animations
    ENTITY_DEFS.filter(e => e.animated).forEach(e => {
      const sh = SHEETS[e.key];
      this.anims.create({
        key: `${e.key}_anim`,
        frames: this.anims.generateFrameNumbers(e.key, { start:0, end: sh.frames - 1 }),
        frameRate: 8,
        repeat: -1,
      });
    });

    // Start game scene (handles all states internally)
    this.scene.launch('Game');
    showOv('ov-title');
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// GAME SCENE  (states: idle → playing → over)
// ══════════════════════════════════════════════════════════════════════════════
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }

  create(){
    gameSceneRef = this;
    const wrap = document.getElementById('play-btn-wrap');
    wrap.style.visibility = 'visible';
    wrap.classList.add('pop-in');
    this.state = 'idle';
    this._lastShot = 0;

    const W = this.scale.width, H = this.scale.height;

    // Background
    this.bg = this.add.image(W/2, H/2, 'bg_game').setDisplaySize(W, H);

    // Plain groups — sprites are created fresh and destroyed each time (no recycling bugs)
    this.trashGrp  = this.add.group();
    this.hazardGrp = this.add.group();
    this.shotGrp   = this.add.group();

    // Collision callbacks
    this.physics.add.overlap(this.shotGrp, this.trashGrp,  (s,t) => this._hitTrash(s,t));
    this.physics.add.overlap(this.shotGrp, this.hazardGrp, (s,h) => this._hitHazard(s,h));

    // Tap to fire
    this.input.on('pointerdown', ptr => this._fire(ptr.x, ptr.y));

    // Merlion origin — where shots emerge from.
    // Adjust mY if projectiles don't appear to come from the Merlion's position.
    this.mX = W * 0.47;
    this.mY = H * 0.67;
  }

  // ── Public: called from DOM buttons ───────────────────────────────────────
  startGame(){
    // Cancel every pending timer (spawn chain, hazard delays, shot kill timers)
    // before starting fresh — prevents dual spawn chains from double-clicks or
    // calling startGame() while a previous session is still winding down.
    this.time.removeAllEvents();

    this.state = 'playing';
    score = 0; lives = MAX_LIVES; timer = GAME_DURATION;
    this._lastShot = 0;
    this._trashInterval  = 1600;   // ms between recyclable spawns
    this._hazardInterval = 2400;   // ms between hazard spawns
    updateHUD();

    document.getElementById('hud').classList.add('on');
    this._resetEntities();

    // Countdown clock (always fresh after removeAllEvents)
    this._timerEvt = this.time.addEvent({
      delay: 1000,
      repeat: GAME_DURATION - 1,
      callback: () => {
        if(this.state !== 'playing') return;
        timer--;
        updateHUD();
        if(timer <= 0) this._endGame();
      },
    });

    // Two independent spawn chains — guarantees a mix of both types at all times
    this._scheduleSpawnTrash();
    this._scheduleSpawnHazard();
  }

  // ── Spawning ───────────────────────────────────────────────────────────────
  _scheduleSpawnTrash(){
    if(this.state !== 'playing') return;
    this.time.delayedCall(this._trashInterval, () => {
      if(this.state !== 'playing') return;
      this._spawnOneFrom(ENTITY_DEFS.filter(d => !d.isHazard));
      this._trashInterval = Math.max(700, this._trashInterval - 15);
      this._scheduleSpawnTrash();
    });
  }

  _scheduleSpawnHazard(){
    if(this.state !== 'playing') return;
    this.time.delayedCall(this._hazardInterval, () => {
      if(this.state !== 'playing') return;
      this._spawnOneFrom(ENTITY_DEFS.filter(d => d.isHazard));
      this._hazardInterval = Math.max(1200, this._hazardInterval - 15);
      this._scheduleSpawnHazard();
    });
  }

  _spawnOneFrom(pool){
    const def    = Phaser.Utils.Array.GetRandom(pool);
    const lanes  = def.zone === 'water' ? ZONE_Y.water
                 : def.zone === 'road'  ? ZONE_Y.road
                 : def.zone === 'air'   ? ZONE_Y.air
                 : [...ZONE_Y.water, ...ZONE_Y.road];
    const laneY  = Phaser.Utils.Array.GetRandom(lanes);
    const spawnX = this.scale.width + 80;

    // Always create a fresh sprite — avoids scale/animation bleed from recycling
    const sp = this.physics.add.sprite(spawnX, laneY, def.key);
    sp.setScale(def.scale || 0.4);

    // 62 % hitbox using unscaled frame size (sp.width on ArcadePhysics sprites
    // returns body.width which already includes scale — use frame.realWidth instead)
    const fw = sp.frame.realWidth;
    const fh = sp.frame.realHeight;
    const hb = def.hbScale ?? 0.62;
    sp.body.setSize(fw * hb, fh * hb, true);

    sp.setData('def', def);
    sp.setFlipX(def.flipX || false);
    sp.setDepth(laneY);

    if(def.animated) sp.play(`${def.key}_anim`, true);

    const speed = Phaser.Math.Between(85, 150);
    if(def.rolling){
      // one full clockwise rotation per ~circumference of the sprite at ground level
      const radius = (sp.displayWidth * 0.5);
      const msPerRot = (2 * Math.PI * radius) / speed * 1000;
      this.tweens.add({ targets:sp, angle:-360, duration:msPerRot, repeat:-1, ease:'Linear' });
    }
    sp.setVelocity(-speed, 0);

    const grp = def.isHazard ? this.hazardGrp : this.trashGrp;
    grp.add(sp);
  }

  // ── Shooting ───────────────────────────────────────────────────────────────
  _fire(_tx, _ty){
    if(this.state !== 'playing') return;
    const now = this.time.now;
    if(now - this._lastShot < FIRE_RATE_MS) return;
    this._lastShot = now;

    const SHOT_SCALE = 0.1; // 1024×1024 image × 0.1 ≈ 102px on screen

    const shot = this.physics.add.sprite(this.mX, this.mY, 'fire_shot');
    shot.setScale(SHOT_SCALE);
    shot.body.setSize(shot.width * 0.42, shot.height * 0.52, true);
    shot.setDepth(500);
    shot.setRotation(0);
    shot.setVelocity(0, -680);
    this.shotGrp.add(shot);

    // Destroy once it leaves the top of the screen
    this.time.delayedCall(1400, () => { if(shot.active) shot.destroy(); });
  }

  // ── Hit callbacks ──────────────────────────────────────────────────────────
  _hitTrash(shot, trash){
    if(!shot.active || !trash.active) return; // guard: overlap fires every frame
    const def = trash.getData('def');
    const pts = def?.pts ?? 10;
    const tx = trash.x, ty = trash.y;
    shot.destroy();
    trash.destroy();
    score += pts;
    updateHUD();
    this._popText(tx, ty, `+${pts}`, '#ffe600');
  }

  _hitHazard(shot, hazard){
    if(!shot.active) return; // guard
    shot.destroy();
    lives--;
    updateHUD();
    this.cameras.main.flash(260, 255, 30, 30, true);
    this.cameras.main.shake(200, 0.011);
    this._popText(hazard.x, hazard.y - 28, 'OOPS!', '#ff4455');
    if(lives <= 0) this.time.delayedCall(550, () => this._endGame());
  }

  // ── Game over ──────────────────────────────────────────────────────────────
  _endGame(){
    if(this.state === 'over') return;
    this.state = 'over';
    if(this._timerEvt) { this._timerEvt.remove(); this._timerEvt = null; }
    this._resetEntities();
    document.getElementById('hud').classList.remove('on');
    document.getElementById('final-score').textContent = score;
    showOv('ov-scoreboard');
  }

  // ── Utilities ──────────────────────────────────────────────────────────────
  _resetEntities(){
    // clear(removeFromScene, destroyChild)
    [this.trashGrp, this.hazardGrp, this.shotGrp].forEach(grp =>
      grp.clear(true, true)
    );
  }

  _popText(x, y, msg, color){
    const t = this.add.text(x, y, msg, {
      fontSize:'26px', fontFamily:"'Arial Rounded MT Bold',Arial,sans-serif",
      color, stroke:'#000', strokeThickness:4,
    }).setOrigin(0.5).setDepth(600);
    this.tweens.add({
      targets:t, y: y - 70, alpha:0, duration:900, ease:'Power2',
      onComplete: () => t.destroy(),
    });
  }

  update(){
    // Destroy entities that crossed the left edge
    // Snapshot with slice() so destroying mid-array doesn't skip entries
    const killX = -130;
    [this.trashGrp, this.hazardGrp].forEach(grp => {
      grp.getChildren().slice().forEach(c => { if(c.x < killX) c.destroy(); });
    });
  }

  shutdown(){
    this.input.removeAllListeners();
    if(this._timerEvt) this._timerEvt.remove();
  }
}

// ── Phaser init ───────────────────────────────────────────────────────────────
const game = new Phaser.Game({
  type:   Phaser.AUTO,
  width:  480,
  height: 845,
  parent: 'game-wrap',
  transparent: true,
  physics:{
    default: 'arcade',
    arcade:  { gravity:{ y:0 }, debug:true }, // set debug:true to see hitboxes
  },
  scale:{
    mode:       Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
  },
  scene: [PreloadScene, GameScene],
});

// ── DOM button wiring ─────────────────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click', () => {
  showOv('ov-tutorial');
  const card = document.getElementById('tutorial-card');
  card.classList.remove('pop-in');
  void card.offsetWidth;
  card.classList.add('pop-in');
});

document.getElementById('btn-close-tutorial').addEventListener('click', () => {
  showOv('ov-title');
});

document.getElementById('btn-start-game').addEventListener('click', () => {
  showOv(null);
  gameSceneRef?.startGame();
});

document.getElementById('btn-play-again').addEventListener('click', () => {
  showOv('ov-tutorial');
  const card = document.getElementById('tutorial-card');
  card.classList.remove('pop-in');
  void card.offsetWidth;
  card.classList.add('pop-in');
});

document.getElementById('btn-exit').addEventListener('click', () => {
  // Clear form and show entry so player can optionally submit score
  document.getElementById('inp-name').value  = '';
  document.getElementById('inp-phone').value = '';
  document.getElementById('entry-err').textContent = '';
  showOv('ov-entry');
});

document.getElementById('btn-submit').addEventListener('click', async () => {
  const name  = document.getElementById('inp-name').value.trim();
  const phone = document.getElementById('inp-phone').value.trim();
  const errEl = document.getElementById('entry-err');
  errEl.textContent = '';

  if(!name || name.length > 20){
    errEl.textContent = 'Name must be 1–20 characters.'; return;
  }
  if(!/^[89]\d{7}$/.test(phone)){
    errEl.textContent = 'Mobile must be 8 digits starting with 8 or 9.'; return;
  }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try{
    const res = await apiPost('/score', { name, phone, score });
    if(res.ok){
      showOv('ov-title');
    } else {
      errEl.textContent = escHtml(res.error || 'Something went wrong.');
    }
  } catch(e){
    errEl.textContent = 'Network error — check your connection.';
  } finally {
    btn.disabled = false; btn.textContent = 'SUBMIT SCORE';
  }
});

document.getElementById('btn-skip').addEventListener('click', () => {
  showOv('ov-title');
});
</script>
