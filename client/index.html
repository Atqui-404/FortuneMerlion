<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>Fortune Merlion: Blooming Hearts</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{
      width:100%;height:100%;
      background:#1a1a2e;
      overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      touch-action:none;
    }
    /* Phone-shaped frame: always keeps the 480:845 portrait ratio and scales
       to fit whatever viewport it's in (small phone, big phone, tablet,
       laptop) — capped so it doesn't stretch into a full-bleed rectangle on
       wide/tall screens like an iPad or desktop browser. */
    #game-wrap{
      position:relative;
      aspect-ratio:480/845;
      width:min(94vw, 94vh * 480 / 845, 600px);
      overflow:hidden;
    }

    /* Standard visual size for every image-based button (matches PLAY's rendered pill width) */
    :root{ --btn-w:195px; }
    .img-btn{ width:var(--btn-w); cursor:pointer; flex-shrink:0; -webkit-user-select:none;user-select:none;-webkit-touch-callout:none; }
    .img-btn img{ width:100%; display:block; pointer-events:none; }
    .img-btn-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:center; max-width:92%; }

    /* ── Overlays ─────────────────────────────────────────────────── */
    .ov{
      position:absolute;inset:0;
      display:none;
      flex-direction:column;align-items:center;justify-content:center;
      z-index:100;
    }
    .ov.on{display:flex;}

    #ov-title{
      background:url('assets/bg/Home.PNG') center/cover no-repeat;
    }

    /* ── HUD ─────────────────────────────────────────────────────── */
    #hud{
      position:absolute;top:0;left:0;right:0;
      padding:10px 14px;
      display:none;
      justify-content:space-between;align-items:center;
      z-index:50;
      pointer-events:none;
    }
    #hud.on{display:flex;}
    #hud-lives{display:flex;gap:4px;align-items:center;}
    #hud-lives img{width:32px;height:32px;object-fit:contain;}
    .hud-num{
      font-size:23px;font-weight:900;color:#fff;
      text-shadow:2px 2px 0 #000,-1px -1px 0 #000;
      font-family:'Arial Rounded MT Bold',Arial,sans-serif;min-width:44px;text-align:center;
    }

    /* ── Fire button ─────────────────────────────────────────────── */
    /* left:47% matches mX (merlion's shot-origin X in GameScene) rather than
       dead-center, since the merlion sprite itself isn't centered in GAME.jpg */
    #btn-fire-wrap{
      position:absolute;left:47%;bottom:34px;
      transform:translateX(-50%);
      width:108px;display:none;z-index:60;cursor:pointer;
      -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    }
    #btn-fire-wrap.on{display:block;}
    #btn-fire-wrap img{width:100%;display:block;pointer-events:none;}
    #btn-fire-wrap:active{transform:translateX(-50%) scale(.92);}

    /* Scoreboard panel moved higher on screen */
    #ov-scoreboard{ justify-content:flex-start; padding-top:20px; }

    /* ── Wooden panel ────────────────────────────────────────────── */
    .panel{
      background:#fdf3dc;
      border:6px solid #8b5e1a;
      border-radius:18px;
      box-shadow:0 6px 28px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35);
      padding:24px 28px;
      text-align:center;
      width:420px;
    }
    .panel-head{
      font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-size:24px;font-weight:bold;
      color:#6b3c10;margin-bottom:10px;
      text-shadow:0 1px 0 rgba(255,255,255,.5);
    }

    /* ── Buttons ─────────────────────────────────────────────────── */
    .btn{
      display:inline-block;padding:12px 28px;
      border-radius:22px;border:none;cursor:pointer;
      font-size:17px;font-weight:bold;font-family:'Arial Rounded MT Bold',Arial,sans-serif;
      letter-spacing:.5px;transition:transform .08s;
    }
    .btn:active{transform:scale(.95);}
    .btn-green{
      background:linear-gradient(180deg,#74cc52,#3e8f22);
      color:#fff;border:3px solid #2d6a14;
      text-shadow:0 1px 2px rgba(0,0,0,.4);
      box-shadow:0 3px 0 #1d4a0d;
    }
    .btn-red{
      background:linear-gradient(180deg,#e06060,#c0392b);
      color:#fff;border:3px solid #922b21;
      box-shadow:0 3px 0 #6e1e14;
    }
    .btn-row{display:flex;gap:14px;justify-content:center;margin-top:16px;}

    /* ── Entry form ──────────────────────────────────────────────── */
    .form-g{margin-bottom:8px;text-align:center;}
    .form-g label{display:block;font-size:14px;color:#5a3210;margin-bottom:2px;font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-weight:bold;}
    .form-g input{
      width:95%;padding:12px 14px;
      border:2px solid #b8832a;border-radius:8px;
      font-size:17px;background:#fffbf0;color:#333;outline:none;
      text-align:center;
    }
    .form-g input:focus{border-color:#e8a030;}
    .err{color:#c0392b;font-size:14px;min-height:18px;margin-bottom:4px;font-family:'Arial Rounded MT Bold',Arial,sans-serif;text-align:center;}
    .pdpa{font-size:12px;color:#7b5020;line-height:1.4;margin:4px 0 6px;text-align:center;}

    /* ── Score display ───────────────────────────────────────────── */
    #final-score{
      font-size:68px;font-weight:900;color:#d4007a;
      font-family:'Arial Rounded MT Bold',Arial,sans-serif;line-height:1;margin:6px 0 16px;
      text-shadow:2px 2px 0 rgba(0,0,0,.2);
    }
    .htp-img{width:100%;border-radius:8px;margin-bottom:14px;}
    @keyframes pop-in{
      0%  { transform:scale(0.4); opacity:0; }
      70% { transform:scale(1.12); opacity:1; }
      100%{ transform:scale(1);   opacity:1; }
    }
    .pop-in{ animation:pop-in 0.45s cubic-bezier(.22,.68,0,1.4) forwards; }
  </style>
</head>
<body>
<div id="game-wrap">

  <!-- ── HUD: lives | timer | score ─────────────────────────────── -->
  <div id="hud">
    <div id="hud-lives"></div>
    <div id="hud-timer" class="hud-num" style="position:absolute;left:50%;transform:translateX(-50%);">1:30</div>
    <div id="hud-score" class="hud-num" style="color:#e91e8c;">0</div>
  </div>

  <!-- ── FIRE BUTTON ────────────────────────────────────────────── -->
  <div id="btn-fire-wrap">
    <img src="assets/ui/FIRE BUTTON.png" alt="Fire">
  </div>

  <!-- ── TITLE ──────────────────────────────────────────────────── -->
  <div class="ov on" id="ov-title">
    <!-- Logo + button grouped and centred together at screen middle -->
    <div id="title-content" style="display:flex;flex-direction:column;align-items:center;gap:0;margin-top:70px;">
      <img src="assets/ui/GAME LOGO.png" style="width:320px;margin-bottom:-100px;" alt="Fortune Merlion: Blooming Hearts">
      <!-- wrapper so we can overlay a precise hit zone over the button visual -->
      <div id="play-btn-wrap" style="position:relative;width:300px;visibility:hidden;">
        <img src="assets/ui/PLAY.png" style="width:100%;display:block;pointer-events:none;" alt="Play">
        <div id="btn-play" style="position:absolute;top:33%;left:10%;right:10%;height:27%;cursor:pointer;border-radius:30px;"></div>
      </div>
    </div>
    <div id="btn-leaderboard-title" style="position:absolute;top:16px;right:16px;width:48px;height:48px;background:rgba(0,0,0,.45);border:2px solid rgba(255,226,52,.7);border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;visibility:hidden;">🏆</div>
  </div>

  <!-- ── HOW TO PLAY ─────────────────────────────────────────────── -->
  <div class="ov" id="ov-tutorial" style="background:rgba(0,0,0,.55);">
    <div id="tutorial-card" style="position:relative;width:min(97%,540px);">
      <img src="assets/ui/HOW TO PLAY.png" style="width:100%;display:block;" alt="How to Play">
      <!-- invisible hit zone over the X button drawn in the image (top-right) -->
      <div id="btn-close-tutorial"
        style="position:absolute;top:4%;right:12%;width:15%;padding-bottom:12%;cursor:pointer;border-radius:50%;"></div>
      <!-- invisible hit zone over the START GAME button drawn in the image (bottom centre) -->
      <div id="btn-start-game"
        style="position:absolute;bottom:3%;left:26%;right:26%;height:10%;cursor:pointer;border-radius:25px;"></div>
    </div>
  </div>

  <!-- ── SCOREBOARD ─────────────────────────────────────────────── -->
  <div class="ov" id="ov-scoreboard" style="background:rgba(0,0,0,.6);">
    <div style="position:relative;width:min(88%,440px);">
      <img src="assets/ui/SCOREBOARD.png" style="width:100%;display:block;" alt="Scoreboard">
      <!-- score overlaid in the blank parchment area -->
      <div style="position:absolute;top:26%;bottom:6%;left:12%;right:12%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;">
        <div style="font-size:38px;color:#1a0a00;font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-weight:900;line-height:1;margin-bottom:8px;text-shadow:1px 1px 0 rgba(255,255,255,.4);">GAME OVER</div>
        <div style="font-size:16px;color:#5a3210;font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-weight:bold;letter-spacing:1px;margin-bottom:2px;">YOUR SCORE:</div>
        <div id="final-score" style="font-size:78px;font-weight:900;color:#e91e8c;line-height:1;font-family:'Arial Rounded MT Bold',Arial,sans-serif;text-shadow:2px 2px 0 rgba(0,0,0,.1);">0</div>
      </div>
    </div>
    <!-- Buttons live below the panel, well clear of the previous screen's fire button -->
    <div class="img-btn-row" style="margin-top:18px;">
      <div id="btn-play-again" class="img-btn"><img src="assets/ui/PLAY AGAIN.png" alt="Play Again"></div>
      <div id="btn-submit-score" class="img-btn"><img src="assets/ui/pixelcut_4 10.png" alt="Submit Score"></div>
    </div>
  </div>

  <!-- ── ENTRY FORM ──────────────────────────────────────────────── -->
  <div class="ov" id="ov-entry" style="background:rgba(0,0,0,.6);">
    <div id="entry-card" style="position:relative;width:min(97%,580px);margin-right:2%;">
      <img src="assets/ui/SUBMIT.png" style="width:100%;display:block;" alt="Submit Your Score">
      <div style="position:absolute;top:27%;bottom:7%;left:18%;right:18%;display:flex;flex-direction:column;justify-content:center;">
        <div class="form-g">
          <label>Name (max 20 characters)</label>
          <input type="text" id="inp-name" maxlength="20" placeholder="Your name" autocomplete="off" autocorrect="off" spellcheck="false">
        </div>
        <div class="form-g">
          <label>Singapore Mobile Number</label>
          <input type="tel" id="inp-phone" maxlength="8" placeholder="8 digits, starting with 8 or 9" inputmode="numeric">
        </div>
        <p class="pdpa">Your mobile number is collected solely to contact the winner. It will never be displayed publicly and will be deleted within 30 days after the event.</p>
        <div class="err" id="entry-err"></div>
      </div>
    </div>
    <div class="img-btn-row" style="margin-top:18px;flex-direction:column;gap:12px;margin-right:2%;">
      <div id="btn-submit" class="img-btn"><img id="img-submit-btn" src="assets/ui/pixelcut_4 10.png" alt="Submit Score"></div>
      <div id="btn-skip" class="img-btn"><img src="assets/ui/SKIP.png" alt="Skip — back to home"></div>
    </div>
  </div>

  <!-- ── LEADERBOARD ───────────────────────────────────────────────── -->
  <div class="ov" id="ov-leaderboard" style="background:rgba(0,0,0,.6);">
    <div id="leaderboard-card" style="position:relative;width:min(96%,560px);">
      <img src="assets/ui/LEADERBOARD.png" style="width:100%;display:block;" alt="Leaderboard">
      <!-- scores injected here, centred in the blank parchment area of the image -->
      <div id="leader-list" style="position:absolute;top:32%;bottom:6%;left:14%;right:14%;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;overflow:hidden;box-sizing:border-box;"></div>
    </div>
    <!-- populated in JS: Back to Home always; Post & Pose only when reached after a score submission -->
    <div id="leaderboard-btn-row" class="img-btn-row" style="margin-top:20px;"></div>
  </div>

  <!-- ── POST & POSE (charm selection) ─────────────────────────────── -->
  <div class="ov" id="ov-charm">
    <div style="position:absolute;inset:0;background:url('assets/bg/Home.PNG') center/cover no-repeat;filter:blur(4px);transform:scale(1.06);"></div>
    <div id="charm-card" style="position:relative;z-index:1;width:min(100%,520px);">
      <img src="assets/ui/PP Screen.png" style="width:100%;height:780px;object-fit:cover;object-position:center top;display:block;" alt="Post &amp; Pose">
      <!-- Content: name, charm grid, disclaimer — buttons are outside this flow -->
      <div style="position:absolute;top:44%;bottom:11%;left:12%;right:12%;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden;">
        <input type="text" id="inp-charm-name" maxlength="20" placeholder="Your name" autocomplete="off" autocorrect="off" spellcheck="false"
          style="width:70%;text-align:center;padding:6px 12px;border:2px solid #b8832a;border-radius:8px;font-size:15px;font-weight:900;font-family:'Arial Rounded MT Bold',Arial,sans-serif;background:#fffbf0;color:#3a1500;outline:none;flex-shrink:0;">
        <div style="font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-size:12px;font-weight:900;color:#6b3c10;letter-spacing:2px;flex-shrink:0;">— PICK YOUR CHARM —</div>
        <div id="charm-grid" style="display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:10px;flex-shrink:0;"></div>
        <div id="charm-err" style="color:#c0392b;font-size:11px;min-height:14px;font-family:'Arial Rounded MT Bold',Arial,sans-serif;flex-shrink:0;"></div>
        <div style="font-size:10px;color:#7b5020;font-family:'Arial Rounded MT Bold',Arial,sans-serif;line-height:1.4;text-align:center;flex-shrink:0;">YOUR CHARM WILL BE LIVE ON THE FORTUNE MERLION<br>IN THE NEXT <span id="charm-eta" style="color:#e91e8c;font-weight:900;">5 MINUTES</span></div>
      </div>
      <!-- POST + BACK TO HOME — hang half off the bottom of the PP frame -->
      <div class="img-btn-row" style="position:absolute;bottom:6px;left:50%;transform:translateX(-50%);z-index:10;white-space:nowrap;">
        <div id="btn-post-charm" class="img-btn"><img src="assets/ui/POST.png" alt="Post"></div>
        <div id="btn-charm-home" class="img-btn"><img src="assets/ui/BACK TO HOME.png" alt="Back to Home"></div>
      </div>
    </div>
  </div>

  <!-- ── FINISH (published confirmation) ───────────────────────────── -->
  <div class="ov" id="ov-finish">
    <div style="position:absolute;inset:0;background:url('assets/bg/Home.PNG') center/cover no-repeat;filter:blur(4px);transform:scale(1.06);"></div>
    <div style="position:relative;z-index:1;width:min(100%,520px);">
      <img src="assets/ui/FINISH.png" style="width:100%;display:block;" alt="Published">
      <!-- invisible zone over the CLOSED button drawn in the PNG -->
      <div id="btn-close-finish" style="position:absolute;bottom:10%;left:27%;right:27%;height:8%;cursor:pointer;border-radius:25px;"></div>
    </div>
  </div>

</div><!-- #game-wrap -->

<script>
'use strict';

// ── Config ────────────────────────────────────────────────────────────────────
const MOCK          = false;   // set false once server is running
const SERVER_URL    = 'https://fortunemerlion-production.up.railway.app';   // e.g. 'https://yourapp.up.railway.app' 
const GAME_DURATION = 60;     // seconds
const MAX_LIVES     = 3;
const FIRE_RATE_MS  = 220;    // minimum ms between shots

// #game-wrap sizing is handled entirely by CSS now (aspect-ratio + min(),
// see the stylesheet) — it always keeps the 480:845 phone shape and fits
// the real viewport without needing JS. Phaser's Scale.FIT + autoCenter
// tracks that CSS-sized parent on its own.

// ── Zone Y-positions (adjust to match where things sit in GAME.jpg) ───────────
// Tip: set  debug:true  in Phaser arcade config below, then fine-tune these
const ZONE_Y = {
  water: [320, 332,343],       // river / waterway band
  road:  [400, 405, 408],       // red running + cycling track
  air:   [245, 285, 313, 340, 367],  // just above waterway — birds visible here, not hidden in sky
};
const MAX_SPAWN_Y = 430; // nothing may spawn below this — keeps entities off the merlion's head

// ── Spritesheet frame sizes ───────────────────────────────────────────────────
// If an animation looks wrong: frameW = image_total_width / num_frames
// Crow (2064×258, 8 frames), Man (2072×296, 7 frames), Woman (2016×288, 7 frames) confirmed.
// Myna, Pigeon — estimate 256×256. Otter — 2-row sheet, estimate 200×200.
const SHEETS = {
  crow:   { frameW: 258, frameH: 258, frames: 8 },
  man:    { frameW: 296, frameH: 296, frames: 7 },
  woman:  { frameW: 288, frameH: 288, frames: 7 },
  myna:   { frameW: 292, frameH: 292, frames: 6 },  // confirmed 1752×292
  otter:  { frameW: 250, frameH: 250, frames: 9 },  // confirmed 2000×500, 2-row (8+1)
  pigeon: { frameW: 254, frameH: 254, frames: 6 },  // confirmed 1524×254
};

// ── Entity definitions ────────────────────────────────────────────────────────
// isHazard false → SHOOT for points
// isHazard true  → DON'T SHOOT (lose a life)
// flipX true     → sprite naturally faces right; flip so it faces left when moving left
// Scale guide for 3200×3200 static sprites (content fills ~50% = ~1600px):
//   60px target  → scale 0.037   |   80px → 0.050   |   100px → 0.062
// Animated sprites have tight frames (no padding) so scale is straightforward.
//
// Score system: higher lane + faster speed → higher points. Plastic bag spawns
// highest, moves fastest, and is worth the most (50); everything else is graded
// down from there in two bands (water, then road) by minSpd/maxSpd and pts.
const ENTITY_DEFS = [
  // ── TRASH — shoot these ── (ordered high/fast/valuable → low/slow/cheap)
  { key:'plastic_bag',file:'Plastic Bag.PNG',        zoneY:[250,265,280], isHazard:false, pts:50, minSpd:180, maxSpd:200, scale:0.040, hbScale:0.45, floating:true },
  { key:'blind_box',  file:'Blind Box.PNG',          zone:'water', isHazard:false, pts:35, minSpd:150, maxSpd:170, scale:0.040, hbScale:0.32 },
  { key:'bottles',    file:'Bottles.PNG',            zone:'water', isHazard:false, pts:28, minSpd:130, maxSpd:150, scale:0.037, hbScale:0.32 },
  { key:'bottle_sub', file:'Bottle Submerged.PNG',   zone:'water', isHazard:false, pts:20, minSpd:110, maxSpd:130, scale:0.037, hbScale:0.32 },
  { key:'pellet',     file:'Pellet.PNG',             zone:'water', isHazard:false, pts:15, minSpd:95,  maxSpd:115, scale:0.025 },
  { key:'lunch',      file:'Lunch.PNG',              zone:'road',  isHazard:false, pts:12, minSpd:80,  maxSpd:100, scale:0.037, hbScale:0.32, rolling:true },
  { key:'bottle',     file:'Bottle.PNG',             zone:'road',  isHazard:false, pts:10, minSpd:70,  maxSpd:90,  scale:0.032, hbScale:0.32, rolling:true },
  { key:'soda_can',   file:'Soda Can.PNG',           zone:'road',  isHazard:false, pts:8,  minSpd:60,  maxSpd:80,  scale:0.020, rolling:true },
  // ── HAZARDS — do NOT shoot ──
  { key:'elderly01',  file:'Elderly 01.PNG',         zone:'road', isHazard:true, scale:0.052, hbScale:0.32 },
  { key:'elderly02',  file:'Elderly 02.PNG',         zone:'road', isHazard:true, scale:0.052, hbScale:0.32 },
  { key:'man',        file:'Man sprite.png',         zone:'road', isHazard:true, scale:0.36, animated:true, hbScale:0.48 },
  { key:'woman',      file:'Woman sprite.png',       zone:'road', isHazard:true, scale:0.35, animated:true, hbScale:0.48 },
  { key:'otter',      file:'Otter sprite.png',       zone:'road', isHazard:true, scale:0.30, animated:true },
  { key:'pigeon',     file:'Pigeon sprite.png',      zone:'road', isHazard:true, scale:0.28, animated:true, hbScale:0.45 },
  { key:'crow',       file:'Crow spritesheet.png',   zoneY:[225,240,255], isHazard:true, scale:0.30, animated:true, hbScale:0.45 },
  { key:'myna',       file:'Myna sprite.png',        zone:'air',  isHazard:true, scale:0.30, animated:true, hbScale:0.45 },
];

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#x27;'}[c]));
}

let _activeOv = null;
function showOv(id){
  if(_activeOv) _activeOv.classList.remove('on');
  _activeOv = id ? document.getElementById(id) : null;
  if(_activeOv) _activeOv.classList.add('on');
}

// ── Leaderboard ───────────────────────────────────────────────────────────────
const MOCK_LEADERS = [
  { name:'Aisha', score:580 }, { name:'Bryan', score:420 },
  { name:'Celine', score:310 }, { name:'Darren', score:280 }, { name:'Evelyn', score:150 },
];
function ordinal(n){
  const s = ['th','st','nd','rd'], v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}
function truncName(s){ return s.length > 8 ? s.slice(0,8) + '…' : s; }

const ROW = (rank, name, sc, pink=false) => {
  const c = pink ? '#e91e8c' : '#3a1500';
  const f = "'Arial Rounded MT Bold',Arial,sans-serif";
  return `<div style="display:flex;align-items:baseline;width:100%;box-sizing:border-box;padding:0;">
    <span style="font-size:26px;font-weight:900;color:${c};font-family:${f};flex-shrink:0;width:88px;">#${String(rank).padStart(2,'0')}</span>
    <span style="font-size:26px;font-weight:900;color:${c};font-family:${f};flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(truncName(name))}</span>
    <span style="font-size:26px;font-weight:900;color:#e91e8c;font-family:${f};flex-shrink:0;padding-left:5px;">${sc}</span>
  </div>`;
};

// Standalone image button (same visual size as PLAY across every screen — see --btn-w)
function makeImgBtn(src, alt, onClick){
  const wrap = document.createElement('div');
  wrap.className = 'img-btn';
  const img = document.createElement('img');

}

// false/omitted when reached via the title-screen trophy icon (Back to Home only —
// there's no submittedName context to post with in that flow).
async function showLeaderboard(playerName=null, playerScore=null, playerRank=null, fromScore=false){
  showOv('ov-leaderboard');
  const card = document.getElementById('leaderboard-card');
  card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in');
  const listEl = document.getElementById('leader-list');
  listEl.innerHTML = `<div style="text-align:center;color:#7b5020;font-family:'Arial Rounded MT Bold',Arial,sans-serif;font-size:13px;">Loading…</div>`;

  const btnRow = document.getElementById('leaderboard-btn-row');
  btnRow.innerHTML = '';
  btnRow.appendChild(makeImgBtn('assets/ui/BACK TO HOME.png', 'Back to Home', () => showOv('ov-title')));
  if(fromScore && submittedName){
    btnRow.appendChild(makeImgBtn('assets/ui/POST AND POSE.png', 'Post & Pose', () => showCharm()));
  }

  try{
    const rows = MOCK
      ? await new Promise(r => setTimeout(() => r(MOCK_LEADERS), 400))
      : await fetch(SERVER_URL + '/leaderboard').then(r => r.json());
    const top = rows.slice(0, 5);
    if(top.length === 0){
      listEl.innerHTML = `<div style="text-align:center;color:#7b5020;font-size:13px;font-family:'Arial Rounded MT Bold',Arial,sans-serif;">No scores yet — be the first!</div>`;
      return;
    }
    let html = top.map((r, i) => ROW(i+1, r.name, r.score, playerRank !== null && (i+1) === playerRank)).join('');
    // show player's own rank below a separator if outside top 5
    if(playerName !== null && playerRank !== null && playerRank > 5){
      html += `<div style="border-top:1px dashed #b8832a;margin:4px 0;"></div>`;
      html += ROW(playerRank, playerName, playerScore, true);
    }
    listEl.innerHTML = html;
  } catch(e){
    listEl.innerHTML = `<div style="text-align:center;color:#c0392b;font-size:13px;font-family:'Arial Rounded MT Bold',Arial,sans-serif;">Could not load scores.</div>`;
  }
}

// ── Network (MOCK-able) ───────────────────────────────────────────────────────
function apiPost(path, body){
  if(MOCK) return new Promise(r =>
    setTimeout(()=> r({ ok:true, rank: Math.ceil(Math.random()*30)+1 }), 500));
  return fetch(SERVER_URL + path, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body),
  }).then(r => r.json());
}

// ── Charm broadcast ETA ─────────────────────────────────────────────────────
// There's no real charm-queue-depth endpoint on the backend yet (display.html /
// the broadcast display don't exist in this repo), so per the debrief's
// "simpler interim measure" we approximate queue depth from the existing
// player-count socket event (total scores submitted) as a rough proxy.
let latestPlayerCount = 0;
if(!MOCK && typeof io !== 'undefined'){
  try{
    const socket = io(SERVER_URL);
    socket.on('player-count', c => { latestPlayerCount = c; });
  } catch(e){ /* socket unavailable — ETA just falls back to the 1-minute floor */ }
}
function estimateQueueMinutes(){
  const HOLD_SEC = 15;        // ~ time each charm holds on the display, per the debrief
  const PROXY_DIVISOR = 10;   // rough assumption: ~1 in 10 recent players are "ahead in queue"
  const depth = Math.max(1, Math.ceil(latestPlayerCount / PROXY_DIVISOR));
  return Math.max(1, Math.round(depth * HOLD_SEC / 60));
}

// PRELOAD SCENE
// ══════════════════════════════════════════════════════════════════════════════
class PreloadScene extends Phaser.Scene {
  constructor(){ super('Preload'); }

  preload(){
    const W = this.scale.width, H = this.scale.height;

    // Canvas is transparent during preload — title screen CSS background shows through
    this.load.on('loaderror', e => console.error('[Asset load failed]', e.key, '→', e.src));

    // Backgrounds
    this.load.image('bg_game', 'assets/bg/GAME.jpg');

    // UI panels/images
    this.load.image('ui_logo',   'assets/ui/GAME LOGO.png');
    this.load.image('ui_finish', 'assets/ui/FINISH.png');
    this.load.image('ui_leader', 'assets/ui/LEADERBOARD.png');

    // HUD icons
    this.load.image('life',      'assets/sprites/LIFE.png');
    this.load.image('lose_icon', 'assets/sprites/LOSE.png');
    this.load.image('fire_shot', 'assets/sprites/FIRE SHOT.png');
    this.load.image('fx_win',   'assets/sprites/WIN.png');
    this.load.image('fx_lost',  'assets/sprites/LOST.png');

    // Audio
    this.load.audio('bgm_game', 'assets/audio/GAME BACKGROUND.mp3');
    this.load.audio('sfx_fire', 'assets/audio/FIRE.mp3');
    this.load.audio('sfx_hit',  'assets/audio/HIT.mp3');
    this.load.audio('sfx_miss', 'assets/audio/MISS.mp3');

    // Static entity images
    ENTITY_DEFS.filter(e => !e.animated).forEach(e =>
      this.load.image(e.key, `assets/sprites/${e.file}`)
    );

    // Animated spritesheets
    ENTITY_DEFS.filter(e => e.animated).forEach(e => {
      const sh = SHEETS[e.key];
      this.load.spritesheet(e.key, `assets/sprites/${e.file}`, {
        frameWidth:  sh.frameW,
        frameHeight: sh.frameH,
      });
    });

    // Charm / fortune cards
    const charmNames = ['EMPATHY','NOBILITY','LONGEVITY','VITALITY','STABILITY','SERENITY'];
    charmNames.forEach((name, i) =>
      this.load.image(`charm_${i}`, `assets/sprites/0${i+1}. ${name}.jpg`)
    );
  }

  create(){
    // Register walk/fly animations
    ENTITY_DEFS.filter(e => e.animated).forEach(e => {
      const sh = SHEETS[e.key];
      this.anims.create({
        key: `${e.key}_anim`,
        frames: this.anims.generateFrameNumbers(e.key, { start:0, end: sh.frames - 1 }),
        frameRate: 8,
        repeat: -1,
      });
    });

    // Start game scene (handles all states internally)
    this.scene.launch('Game');
    showOv('ov-title');
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// GAME SCENE  (states: idle → playing → over)
// ══════════════════════════════════════════════════════════════════════════════
class GameScene extends Phaser.Scene {
  constructor(){ super('Game'); }

  create(){
    gameSceneRef = this;
    // Trophy/leaderboard icon fades in first, then PLAY follows ~350ms later
    const lbBtn = document.getElementById('btn-leaderboard-title');
    lbBtn.style.visibility = 'visible';
    lbBtn.classList.add('pop-in');
    const wrap = document.getElementById('play-btn-wrap');
    setTimeout(() => {
      wrap.style.visibility = 'visible';
      wrap.classList.add('pop-in');
    }, 350);
    this.state = 'idle';
    this._lastShot = 0;

    const W = this.scale.width, H = this.scale.height;

    // Background
    this.bg = this.add.image(W/2, H/2, 'bg_game').setDisplaySize(W, H);

    // Plain groups — sprites are created fresh and destroyed each time (no recycling bugs)
    this.trashGrp  = this.add.group();
    this.hazardGrp = this.add.group();
    this.shotGrp   = this.add.group();

    // Collision callbacks
    this.physics.add.overlap(this.shotGrp, this.trashGrp,  (s,t) => this._hitTrash(s,t));
    this.physics.add.overlap(this.shotGrp, this.hazardGrp, (s,h) => this._hitHazard(s,h));

    // Firing is only triggered by the FIRE button (#btn-fire-wrap) — no tap-anywhere.

    // Merlion origin — where shots emerge from.
    // Adjust mY if projectiles don't appear to come from the Merlion's position.
    this.mX = W * 0.47;
    this.mY = H * 0.67;

    // Audio
    this.bgm     = this.sound.add('bgm_game', { volume:0.35, loop:true });
    this.sfxFire = this.sound.add('sfx_fire', { volume:0.6 });
    this.sfxHit  = this.sound.add('sfx_hit',  { volume:0.7 });
    this.sfxMiss = this.sound.add('sfx_miss', { volume:0.7 });
  }

  // ── Public: called from DOM buttons ───────────────────────────────────────
  startGame(){
    // Cancel every pending timer (spawn chain, hazard delays, shot kill timers)
    // before starting fresh — prevents dual spawn chains from double-clicks or
    // calling startGame() while a previous session is still winding down.
    this.time.removeAllEvents();

    this.state = 'playing';
    score = 0; lives = MAX_LIVES; timer = GAME_DURATION;
    this._lastShot = 0;
    this._trashInterval  = 1600;   // ms between recyclable spawns
    this._hazardInterval = 2400;   // ms between hazard spawns
    updateHUD();

    document.getElementById('hud').classList.add('on');
    document.getElementById('btn-fire-wrap').classList.add('on');
    this._resetEntities();

    this.bgm.stop();
    this.bgm.setVolume(0.35);
    this.bgm.play();

    // Countdown clock (always fresh after removeAllEvents)
    this._timerEvt = this.time.addEvent({
      delay: 1000,
      repeat: GAME_DURATION - 1,
      callback: () => {
        if(this.state !== 'playing') return;
        timer--;
        updateHUD();
        if(timer <= 0) this._endGame();
      },
    });

    // Two independent spawn chains — guarantees a mix of both types at all times
    this._scheduleSpawnTrash();
    this._scheduleSpawnHazard();
  }

  // ── Spawning ───────────────────────────────────────────────────────────────
  _scheduleSpawnTrash(){
    if(this.state !== 'playing') return;
    this.time.delayedCall(this._trashInterval, () => {
      if(this.state !== 'playing') return;
      this._spawnOneFrom(ENTITY_DEFS.filter(d => !d.isHazard));
      this._trashInterval = Math.max(700, this._trashInterval - 15);
      this._scheduleSpawnTrash();
    });
  }

  _scheduleSpawnHazard(){
    if(this.state !== 'playing') return;
    this.time.delayedCall(this._hazardInterval, () => {
      if(this.state !== 'playing') return;
      this._spawnOneFrom(ENTITY_DEFS.filter(d => d.isHazard));
      this._hazardInterval = Math.max(1200, this._hazardInterval - 15);
      this._scheduleSpawnHazard();
    });
  }

  _spawnOneFrom(pool){
    const def    = Phaser.Utils.Array.GetRandom(pool);
    const lanes  = def.zoneY || (
                   def.zone === 'water' ? ZONE_Y.water
                 : def.zone === 'road'  ? ZONE_Y.road
                 : def.zone === 'air'   ? ZONE_Y.air
                 : [...ZONE_Y.water, ...ZONE_Y.road]);
    const laneY  = Math.min(Phaser.Utils.Array.GetRandom(lanes), MAX_SPAWN_Y);
    const spawnX = this.scale.width + 80;

    // Always create a fresh sprite — avoids scale/animation bleed from recycling
    const sp = this.physics.add.sprite(spawnX, laneY, def.key);
    sp.setScale(def.scale || 0.4);

    // 62 % hitbox using unscaled frame size (sp.width on ArcadePhysics sprites
    // returns body.width which already includes scale — use frame.realWidth instead)
    const fw = sp.frame.realWidth;
    const fh = sp.frame.realHeight;
    const hb = def.hbScale ?? 0.62;
    sp.body.setSize(fw * hb, fh * hb, true);

    sp.setData('def', def);
    sp.setFlipX(def.flipX || false);
    sp.setDepth(laneY);

    if(def.animated) sp.play(`${def.key}_anim`, true);

    const speed = def.minSpd != null
      ? Phaser.Math.Between(def.minSpd, def.maxSpd)
      : Phaser.Math.Between(85, 150);
    if(def.rolling){
      const radius = (sp.displayWidth * 0.5);
      const msPerRot = (2 * Math.PI * radius) / speed * 1000;
      this.tweens.add({ targets:sp, angle:-360, duration:msPerRot, repeat:-1, ease:'Linear' });
    }
    if(def.floating){
      // drift up and down like caught in wind
      this.tweens.add({ targets:sp, y:`+=${Phaser.Math.Between(10,18)}`, duration:Phaser.Math.Between(700,1000), yoyo:true, repeat:-1, ease:'Sine.inOut' });
      // flutter/tilt
      this.tweens.add({ targets:sp, angle:{ from:-14, to:14 }, duration:Phaser.Math.Between(500,750), yoyo:true, repeat:-1, ease:'Sine.inOut' });
    }
    sp.setVelocity(-speed, 0);

    const grp = def.isHazard ? this.hazardGrp : this.trashGrp;
    grp.add(sp);
  }

  // ── Shooting ───────────────────────────────────────────────────────────────
  _fire(_tx, _ty){
    if(this.state !== 'playing') return;
    const now = this.time.now;
    if(now - this._lastShot < FIRE_RATE_MS) return;
    this._lastShot = now;
    this.sfxFire.play();

    const SHOT_SCALE = 0.1; // 1024×1024 image × 0.1 ≈ 102px on screen

    const shot = this.physics.add.sprite(this.mX, this.mY, 'fire_shot');
    shot.setScale(SHOT_SCALE);
    shot.body.setSize(shot.width * 0.42, shot.height * 0.52, true);
    shot.setDepth(500);
    shot.setRotation(0);
    shot.setVelocity(0, -680);
    this.shotGrp.add(shot);

    // Destroy once it leaves the top of the screen
    this.time.delayedCall(1400, () => { if(shot.active) shot.destroy(); });
  }

  // ── Hit callbacks ──────────────────────────────────────────────────────────
  _hitTrash(shot, trash){
    if(!shot.active || !trash.active) return;
    const def = trash.getData('def');
    const pts = def?.pts ?? 10;
    const tx = trash.x, ty = trash.y;
    shot.destroy();
    trash.destroy();
    score += pts;
    updateHUD();
    this.sfxHit.play();
    this._popFx(tx, ty, 'fx_win', 0.07, 600, 80);
    this._popText(tx + 55, ty, `+${pts}`, '#ffe600');
  }

  _hitHazard(shot, hazard){
    if(!shot.active) return;
    shot.destroy();
    lives--;
    updateHUD();
    this.sfxMiss.play();
    this.cameras.main.flash(260, 255, 30, 30, true);
    this.cameras.main.shake(200, 0.011);
    this._popFx(hazard.x - 40, hazard.y, 'fx_lost', 0.07, 1400);
    if(lives <= 0) this.time.delayedCall(550, () => this._endGame());
  }

  // ── Game over ──────────────────────────────────────────────────────────────
  _endGame(){
    if(this.state === 'over') return;
    this.state = 'over';
    if(this._timerEvt) { this._timerEvt.remove(); this._timerEvt = null; }
    this._resetEntities();
    document.getElementById('hud').classList.remove('on');
    document.getElementById('btn-fire-wrap').classList.remove('on');
    document.getElementById('final-score').textContent = score;
    this.tweens.add({
      targets:this.bgm, volume:0, duration:600,
      onComplete: () => this.bgm.stop(),
    });
    showOv('ov-scoreboard');
  }

  // ── Utilities ──────────────────────────────────────────────────────────────
  _resetEntities(){
    // clear(removeFromScene, destroyChild)
    [this.trashGrp, this.hazardGrp, this.shotGrp].forEach(grp =>
      grp.clear(true, true)
    );
  }

  _popText(x, y, msg, color){
    const t = this.add.text(x, y, msg, {
      fontSize:'26px', fontFamily:"'Arial Rounded MT Bold',Arial,sans-serif",
      color, stroke:'#000', strokeThickness:4,
    }).setOrigin(0.5).setDepth(600);
    this.tweens.add({
      targets:t, y: y - 70, alpha:0, duration:1400, ease:'Power2',
      onComplete: () => t.destroy(),
    });
  }

  // Pops an image asset at (x,y), scales in then floats up and fades
  _popFx(x, y, key, scale = 0.15, fadeDuration = 600, popDuration = 180){
    const img = this.add.image(x, y, key).setScale(0).setDepth(601);
    this.tweens.add({
      targets: img, scaleX: scale, scaleY: scale,
      duration: popDuration, ease: 'Back.Out',
      onComplete: () => {
        this.tweens.add({
          targets: img, y: y - 80, alpha: 0,
          duration: fadeDuration, ease: 'Power2',
          onComplete: () => img.destroy(),
        });
      },
    });
  }

  // Pops the ♻ recycling symbol at (x,y)
  _popRecycle(x, y){
    const t = this.add.text(x, y, '♻', { fontSize:'52px' })
      .setOrigin(0.5).setDepth(601).setScale(0);
    this.tweens.add({
      targets: t, scaleX: 1, scaleY: 1,
      duration: 200, ease: 'Back.Out',
      onComplete: () => {
        this.tweens.add({
          targets: t, y: y - 80, alpha: 0,
          duration: 700, ease: 'Power2',
          onComplete: () => t.destroy(),
        });
      },
    });
  }

  update(){
    // Destroy entities that crossed the left edge
    // Snapshot with slice() so destroying mid-array doesn't skip entries
    const killX = -130;
    [this.trashGrp, this.hazardGrp].forEach(grp => {
      grp.getChildren().slice().forEach(c => { if(c.x < killX) c.destroy(); });
    });
  }

  shutdown(){
    this.input.removeAllListeners();
    if(this._timerEvt) this._timerEvt.remove();
  }
}

    return;
  }
  if(!selectedCharm){
    errEl.textContent = 'Please pick a charm first.';
    return;
  }
  errEl.textContent = '';
  const btn = document.getElementById('btn-post-charm');
  btn.style.pointerEvents = 'none'; btn.style.opacity = '0.5';
  try{
    await apiPost('/charm', { name, charm: selectedCharm });
  } catch(e){ /* fire-and-forget — still show finish screen */ }
  showOv('ov-finish');
});

document.getElementById('btn-close-finish').addEventListener('click', () => {
  showOv('ov-title');
});
</script>
</body>
</html>
