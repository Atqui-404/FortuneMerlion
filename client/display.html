<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Fortune Merlion: Broadcast Display</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;
    background:#051a0d;
    overflow:hidden;
    font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  }

  /* ── Ambient particles ───────────────────────────────────────────── */
  #particles{ position:fixed; inset:0; overflow:hidden; z-index:1; pointer-events:none; }
  .particle{
    position:absolute;
    bottom:-10px;
    border-radius:50%;
    opacity:.55;
    animation-name:float-up;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes float-up{
    from{ transform:translateY(0); opacity:.55; }
    to{ transform:translateY(-110vh); opacity:0; }
  }

  /* ── Idle state ──────────────────────────────────────────────────── */
  #idle{
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px;
  }
  #idle.hidden{ display:none; }
  #idle-title{
    font-size:min(9vw,90px);
    font-weight:900;
    letter-spacing:6px;
    background:linear-gradient(90deg,#ffd166,#e91e8c,#06d6a0,#ffd166);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:hue-shift 6s linear infinite;
  }
  @keyframes hue-shift{
    0%{ background-position:0% 50%; }
    100%{ background-position:300% 50%; }
  }
  #idle-subtitle{ font-size:min(3vw,28px); color:#e8fff0; letter-spacing:2px; }
  #idle-prompt{ font-size:min(2.2vw,20px); color:#8fd9b0; letter-spacing:1px; }

  /* ── Charm reveal ────────────────────────────────────────────────── */
  #reveal{
    position:fixed; inset:0; z-index:2;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:24px;
  }
  #reveal.on{ display:flex; }
  #reveal-img{
    max-width:min(60vw,600px);
    max-height:65vh;
    border-radius:18px;
    box-shadow:0 0 60px rgba(233,30,140,.55);
  }
  #reveal-name{ font-size:min(4vw,40px); color:#ffe08a; font-weight:900; letter-spacing:2px; }

  /* ── Ticker ──────────────────────────────────────────────────────── */
  #ticker-wrap{
    position:fixed; top:0; left:0; right:0; height:52px; z-index:3;
    background:rgba(0,0,0,.55);
    overflow:hidden;
    display:flex; align-items:center;
    border-bottom:1px solid rgba(255,255,255,.15);
  }
  #ticker{
    display:inline-flex; white-space:nowrap;
    animation:ticker-scroll 22s linear infinite;
    padding-left:100%;
  }
  #ticker span{
    color:#e8fff0; font-size:18px; letter-spacing:1px; padding:0 40px;
  }
  @keyframes ticker-scroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-100%); }
  }

  /* ── Ribbon ──────────────────────────────────────────────────────── */
  #ribbon{
    position:fixed; bottom:0; left:0; right:0; height:44px; z-index:3;
    background:rgba(0,0,0,.55);
    display:flex; align-items:center; gap:10px;
    padding:0 18px;
    border-top:1px solid rgba(255,255,255,.15);
    color:#e8fff0; font-size:14px; letter-spacing:1px;
  }
  #status-dot{
    width:12px; height:12px; border-radius:50%;
    background:#e63946;
  }
  #status-dot.connected{
    background:#06d6a0;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(6,214,160,.6); }
    50%{ box-shadow:0 0 0 8px rgba(6,214,160,0); }
  }
  #status-text{ opacity:.8; }
  #player-count{ margin-left:auto; font-weight:900; }
</style>
</head>
<body>

<div id="particles"></div>

<div id="ticker-wrap"><div id="ticker" id="ticker"></div></div>

<div id="idle">
  <div id="idle-title">FORTUNE MERLION</div>
  <div id="idle-subtitle">Blooming Hearts — Live Charm Wall</div>
  <div id="idle-prompt">Scan the QR code to play and post your charm</div>
</div>

<div id="reveal">
  <img id="reveal-img" src="" alt="">
  <div id="reveal-name"></div>
</div>

<div id="ribbon">
  <div id="status-dot"></div>
  <span id="status-text">Connecting…</span>
  <span id="player-count">0 players</span>
</div>

<script>
const SERVER_URL = 'https://fortunemerlion-production.up.railway.app';
const HOLD_MS = 15000;

const CHARMS = {
  empathy:   { label:'EMPATHY',   file:'01. EMPATHY.jpg' },
  nobility:  { label:'NOBILITY',  file:'02. NOBILITY.jpg' },
  longevity: { label:'LONGEVITY', file:'03. LONGEVITY.jpg' },
  vitality:  { label:'VITALITY',  file:'04. VITALITY.jpg' },
  stability: { label:'STABILITY', file:'05. STABILITY.jpg' },
  serenity:  { label:'SERENITY',  file:'06. SERENITY.jpg' },
};

// ── Elements ─────────────────────────────────────────────────────────────
const idleEl        = document.getElementById('idle');
const revealEl       = document.getElementById('reveal');
const revealImgEl    = document.getElementById('reveal-img');
const revealNameEl   = document.getElementById('reveal-name');
const tickerEl        = document.getElementById('ticker');
const statusDotEl     = document.getElementById('status-dot');
const statusTextEl    = document.getElementById('status-text');
const playerCountEl   = document.getElementById('player-count');
const particlesEl     = document.getElementById('particles');

// ── Ambient particles ────────────────────────────────────────────────────
const PARTICLE_COLORS = ['#ffd166','#e91e8c','#06d6a0','#8fd9b0','#ffe08a'];
function spawnParticle(){
  const p = document.createElement('div');
  p.className = 'particle';
  const size = 4 + Math.random() * 8;
  const duration = 7000 + Math.random() * 6000;
  p.style.left = (Math.random() * 100) + '%';
  p.style.width = size + 'px';
  p.style.height = size + 'px';
  p.style.background = PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)];
  p.style.animationDuration = duration + 'ms';
  particlesEl.appendChild(p);
  setTimeout(() => p.remove(), duration + 200);
}
setInterval(spawnParticle, 900);

// ── Ticker (last 8 charms received, most recent first) ─────────────────
const tickerHistory = [];
function addTickerEntry(name, charm){
  tickerHistory.unshift({ name, charm });
  if (tickerHistory.length > 8) tickerHistory.length = 8;
  tickerEl.innerHTML = tickerHistory
    .map(e => `<span>${escapeHtml(e.name)} — ${CHARMS[e.charm].label}</span>`)
    .join('');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#x27;' }[c])
  );
}

// ── Reveal queue (FIFO, never drops, never interrupts) ──────────────────
const queue = [];
let showing = false;

function goIdle(){
  revealEl.classList.remove('on');
  idleEl.classList.remove('hidden');
}
function goReveal(item){
  idleEl.classList.add('hidden');
  revealImgEl.src = `assets/sprites/${CHARMS[item.charm].file}`;
  revealImgEl.alt = CHARMS[item.charm].label;
  revealNameEl.textContent = `from ${item.name}`;
  revealEl.classList.add('on');
}
function showNext(){
  if (queue.length === 0){
    showing = false;
    goIdle();
    return;
  }
  showing = true;
  const item = queue.shift();
  goReveal(item);
  setTimeout(showNext, HOLD_MS);
}

// ── Socket.io ─────────────────────────────────────────────────────────
const socket = io(SERVER_URL, {
  reconnectionAttempts: Infinity,
  reconnectionDelay: 2000,
});

socket.on('connect', () => {
  statusDotEl.classList.add('connected');
  statusTextEl.textContent = 'Connected';
});
socket.on('disconnect', () => {
  statusDotEl.classList.remove('connected');
  statusTextEl.textContent = 'Disconnected';
});

socket.on('player-count', count => {
  const n = Number(count) || 0;
  playerCountEl.textContent = `${n} player${n === 1 ? '' : 's'}`;
});

socket.on('new-charm', ({ name, charm } = {}) => {
  if (!CHARMS[charm]) return; // defensively ignore unrecognized charm ids
  addTickerEntry(name, charm);
  queue.push({ name, charm });
  if (!showing) showNext();
});
</script>
</body>
</html>
