<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortune Merlion — Live Wall</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; background:#051a0d; overflow:hidden; transition:background-color .5s ease;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; }

  /* ---- idle state ---- */
  #idle { display:flex; flex-direction:column; align-items:center; gap:28px; }
  #idle-title { font-size:min(9vw,90px); font-weight:900; letter-spacing:4px;
    background:linear-gradient(90deg,#ff6fa5,#ffd85e,#7dffb0,#6fd8ff,#c68fff,#ff6fa5);
    background-size:300% 100%; -webkit-background-clip:text; background-clip:text;
    color:transparent; animation:hue 6s linear infinite; text-align:center; }
  @keyframes hue { to { background-position:300% 0; } }
  #idle-sub { color:#eafff2; font-size:min(3vw,28px); opacity:.85; text-align:center; }
  #idle-qr-hint { color:#7dffb0; font-size:min(2.2vw,22px); font-weight:700; }

  /* floating particles */
  .particle { position:fixed; bottom:-40px; border-radius:50%; opacity:.55;
    animation:float linear infinite; pointer-events:none; }
  @keyframes float { to { transform:translateY(-110vh) translateX(var(--dx)); opacity:0; } }

  /* ---- charm reveal state: full-screen charm, name pinned to top ---- */
  #reveal { display:none; }
  #reveal.show { display:block; }
  #reveal-img { position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:0; }
  #reveal-name { position:fixed; top:70px; left:0; right:0; z-index:1;
    text-align:center; color:#ffd85e; font-size:min(6vw,52px); font-weight:800;
    text-shadow:0 2px 12px rgba(0,0,0,.6); }

  /* ---- bottom ribbon ---- */
  #ribbon { position:fixed; left:0; right:0; bottom:0; height:64px; z-index:10;
    background:rgba(0,0,0,.35); transition:background .5s ease; display:flex; align-items:center;
    justify-content:center; gap:14px; color:#eafff2; font-size:20px; font-weight:600; }
  #dot { width:12px; height:12px; border-radius:50%; background:#4caf50;
    box-shadow:0 0 8px #4caf50; animation:pulse 1.6s ease-in-out infinite; }
  #dot.off { background:#d33; box-shadow:0 0 8px #d33; animation:none; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---- top ticker ---- */
  #ticker-wrap { position:fixed; top:0; left:0; right:0; height:48px; z-index:10;
    background:rgba(0,0,0,.3); transition:background .5s ease; overflow:hidden; display:flex; align-items:center; }
  #ticker { display:flex; gap:48px; white-space:nowrap; padding-left:100%;
    animation:scroll 24s linear infinite; color:#cdeedd; font-size:16px; font-weight:600; }
  @keyframes scroll { to { transform:translateX(-100%); } }
</style>
</head>
<body>

<div id="ticker-wrap"><div id="ticker"></div></div>

<div id="stage">
  <div id="idle">
    <div id="idle-title">FORTUNE MERLION</div>
    <div id="idle-sub">Shoot hearts, save the harbour, make a wish 💚</div>
    <div id="idle-qr-hint">✨ Scan the QR code to play and post your charm ✨</div>
  </div>

  <div id="reveal">
    <img id="reveal-img" src="" alt="Charm">
    <div id="reveal-name"></div>
  </div>
</div>

<div id="ribbon">
  <div id="dot"></div>
  <span id="ribbon-text">Connecting…</span>
</div>

<script>
'use strict';

/* =========================================================
   CONFIG — must match the SERVER_URL used in the game client
   ========================================================= */
const SERVER_URL = 'https://fortunemerlion-production.up.railway.app'; // <-- confirm this matches your live backend

const CHARM_NAMES = {
  empathy: 'Love & Empathy', nobility: 'Nobility', longevity: 'Longevity',
  vitality: 'Vitality', stability: 'Stability', serenity: 'Serenity'
};
// High-res versions (client/assets/sprites/) for the full-screen reveal — much
// bigger than the small sprites the game itself uses for its charm picker, so
// object-fit:cover across a whole display screen doesn't look blurry/upscaled.
const CHARM_FILES = {
  empathy: '01. EMPATHY highres.jpg', nobility: '02. NOBILITY high res.jpg', longevity: '03. LONGEVITY highres.jpg',
  vitality: '04. VITALITY highres.jpg', stability: '05. STABILITY highres.jpg', serenity: '06. SERENITY highres.jpg'
};
// Exact brand color per charm, matching each charm's own background art
const CHARM_COLORS = {
  empathy:   '#FF829A', // pink
  nobility:  '#33A7B4', // teal
  longevity: '#C6BA26', // olive
  vitality:  '#A360C1', // purple
  stability: '#FF9400', // orange
  serenity:  '#49CCD4'  // cyan
};
const IDLE_COLOR = '#051a0d';

// Preload every charm's full-res art into the browser cache as soon as the
// page loads, not on first reveal — these are multi-MB files, so without
// this the very first time each charm is posted it'd stall on the network
// fetch. Kept in an array so the Image objects (and their in-flight
// requests) aren't garbage-collected before they finish loading.
const preloadedCharmImages = Object.values(CHARM_FILES).map(file => {
  const img = new Image();
  img.src = `assets/sprites/${file}`;
  return img;
});

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

function applyTheme(hex) {
  document.body.style.backgroundColor = hex;
  document.getElementById('ticker-wrap').style.background = hexToRgba(hex, 0.55);
  document.getElementById('ribbon').style.background = hexToRgba(hex, 0.55);
}
const HOLD_MS = 30000; // how long each charm stays on screen

let queue = [];
let showing = false;
let tickerHistory = []; // last 8 { name, charm }

const idleEl    = document.getElementById('idle');
const revealEl  = document.getElementById('reveal');
const revealImg = document.getElementById('reveal-img');
const revealName= document.getElementById('reveal-name');
const dotEl     = document.getElementById('dot');
const ribbonTxt = document.getElementById('ribbon-text');
const tickerEl  = document.getElementById('ticker');

function updateRibbon() {
  const waiting = queue.length; // charms waiting behind the one currently showing (if any)
  ribbonTxt.textContent = waiting === 1 ? '1 charm in queue' : `${waiting} charms in queue`;
}

function renderTicker() {
  if (tickerHistory.length === 0) {
    tickerEl.innerHTML = '<span>Waiting for the next charm…</span>';
    return;
  }
  tickerEl.innerHTML = tickerHistory
    .map(t => `<span>${escapeHtml(t.name)} - ${CHARM_NAMES[t.charm] || t.charm}</span>`)
    .join('');
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showNext() {
  if (queue.length === 0) {
    showing = false;
    revealEl.classList.remove('show');
    idleEl.style.display = 'flex';
    applyTheme(IDLE_COLOR);
    return;
  }
  showing = true;
  idleEl.style.display = 'none';
  const item = queue.shift();
  updateRibbon();
  revealImg.src = `assets/sprites/${CHARM_FILES[item.charm]}`;
  revealImg.alt = CHARM_NAMES[item.charm] || item.charm;
  revealName.textContent = item.name;
  revealEl.classList.add('show');
  applyTheme(CHARM_COLORS[item.charm] || IDLE_COLOR);
  setTimeout(showNext, HOLD_MS);
}

function enqueueCharm(payload) {
  if (!payload || !CHARM_NAMES[payload.charm]) return; // ignore malformed/unknown charm ids
  queue.push(payload);
  tickerHistory.unshift(payload);
  tickerHistory = tickerHistory.slice(0, 8);
  renderTicker();
  updateRibbon();
  if (!showing) showNext();
}

/* ---- floating background particles (idle state ambiance) ---- */
function spawnParticle() {
  const p = document.createElement('div');
  p.className = 'particle';
  const size = 8 + Math.random() * 18;
  p.style.width = p.style.height = size + 'px';
  p.style.left = Math.random() * 100 + 'vw';
  p.style.background = ['#ff8fb3','#ffd85e','#7dffb0','#6fd8ff'][Math.floor(Math.random()*4)];
  p.style.setProperty('--dx', (Math.random() * 80 - 40) + 'px');
  p.style.animationDuration = (8 + Math.random() * 6) + 's';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 15000);
}
setInterval(spawnParticle, 900);

/* ---- socket.io wiring ---- */
const socket = io(SERVER_URL, { reconnectionAttempts: Infinity, reconnectionDelay: 2000 });

socket.on('connect', () => {
  dotEl.classList.remove('off');
  updateRibbon();
});
socket.on('disconnect', () => {
  dotEl.classList.add('off');
  ribbonTxt.textContent = 'Reconnecting…';
});
// player-count is still emitted by the backend but no longer drives the ribbon —
// the ribbon now shows queue depth instead (see updateRibbon). Left listening
// in case it's wanted again later; currently a no-op.
socket.on('player-count', () => {});
socket.on('new-charm', payload => enqueueCharm(payload));

renderTicker();
</script>
</body>
</html>
